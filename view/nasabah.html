<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Nasabah - PT Equityworld Futures</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Daftar Nasabah</h1>
        
        <table class="w-full text-left border-collapse border border-slate-800">
            <thead>
                <tr class="bg-slate-900 border-b border-slate-800">
                    <th class="p-3">ID</th>
                    <th class="p-3">Nama</th>
                    <th class="p-3">Email</th>
                    <th class="p-3">Telepon</th>
                </tr>
            </thead>
            <tbody>
                {{range .}}
                <tr class="border-b border-slate-800 hover:bg-slate-900">
                    <td class="p-3">{{.ID}}</td>
                    <td class="p-3">{{.Nama}}</td>
                    <td class="p-3">{{.Email}}</td>
                    <td class="p-3">{{.Telp}}</td>
                </tr>
                {{else}}
                <tr>
                    <td colspan="4" class="p-3 text-center text-slate-400">Belum ada data nasabah.</td>
                </tr>
                {{end}}
            </tbody>
        </table>
    </div>
</body>
</html>
